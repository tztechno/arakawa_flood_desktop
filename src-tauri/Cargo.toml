[package]
name = "arakawa_flood_desktop"
version = "1.0.0"
description = "Arakawa Flood — 荒川第一調節池・荒川流域 3Dシミュレーター"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "arakawa_flood_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
